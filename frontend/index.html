<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Stats Tracker</title>
    <!-- Favicon qua bang emoji, khong can file anh rieng -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>"
    />
    <!-- Be Vietnam Pro: chu chinh, ho tro day du dau tieng Viet.
         Oswald: chu condensed rieng cho SO LIEU (ty so, thu hang...) - kieu bang dien tu san van dong,
         chi dung cho chu so nen khong can ho tro dau tieng Viet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Mo ta cho cong cu tim kiem -->
    <meta
      name="description"
      content="Theo dõi bảng xếp hạng, lịch thi đấu, kết quả và vua phá lưới của 6 giải bóng đá hàng đầu châu Âu. Dự đoán tỉ số và thi tài với bạn bè."
    />

    <!--
      The chia se (Open Graph): quyet dinh link hien ra the nao khi dan vao Messenger,
      Zalo, Facebook. Thieu chung thi link hien ra mot o trong tron, khong anh khong
      mo ta - nhin nhu link hong nen it ai bam vao.

      og:image dang dung bieu tuong vuong 512x512 co san. Muon dep hon thi dat mot anh
      ngang 1200x630 vao public/og-image.png roi doi duong dan o duoi - kich thuoc do la
      chuan cua Facebook, hien ra thanh banner rong thay vi o vuong nho.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Football Stats Tracker" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Football Stats Tracker" />
    <meta
      property="og:description"
      content="Bảng xếp hạng, lịch thi đấu và kết quả 6 giải hàng đầu châu Âu. Dự đoán tỉ số và thi tài với bạn bè."
    />
    <meta property="og:url" content="https://football-stats-tracker-jet.vercel.app/" />
    <meta property="og:image" content="https://football-stats-tracker-jet.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Football Stats Tracker" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Football Stats Tracker" />
    <meta
      name="twitter:description"
      content="Bảng xếp hạng, lịch thi đấu và kết quả 6 giải hàng đầu châu Âu. Dự đoán tỉ số và thi tài với bạn bè."
    />
    <meta name="twitter:image" content="https://football-stats-tracker-jet.vercel.app/icon-512.png" />

    <link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0F3D26" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FootballTracker" />
<link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
